<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argus Distribusi - Laporan Persediaan & Pelanggan</title>
    
    <!-- Fonts: Montserrat & Inter (Lichess Match) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800;950&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- React and ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for on-the-fly JSX compilation (Vercel deployment compliant) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #faf6f2; /* Soft warm background reminiscent of Lichess */
        }
        /* Hide scrollbars but permit scrolling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#faf6f2] text-neutral-800 antialiased min-h-screen flex flex-col items-center justify-start py-4 px-2">

    <div id="root" class="w-full max-w-md bg-[#faf6f2] rounded-3xl overflow-hidden shadow-sm border border-neutral-200/50 min-h-[820px] flex flex-col relative">
        <div class="flex items-center justify-center p-8 text-neutral-400">
            <p>Memuat Laporan & Kasir Argus...</p>
        </div>
    </div>

    <!-- Application Script (compiled via Babel) -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Custom initial data helper
        const createTimestamp = (daysAgo, hour, minute) => {
            const baseDate = new Date();
            baseDate.setDate(baseDate.getDate() - daysAgo);
            baseDate.setHours(hour, minute, 0, 0);
            return baseDate.getTime();
        };

        const INITIAL_CUSTOMERS = [
            { id: 'c1', name: 'Pak Budi', phone: '0812-3456-7890', kecamatan: 'Biringkanaya', kelurahan: 'Daya', address: 'Jl. Perintis Kemerdekaan KM 12 No. 5', role: 'agen' },
            { id: 'c2', name: 'Toko Berkah Utama', phone: '0852-1122-3344', kecamatan: 'Rappocini', kelurahan: 'Kassi-Kassi', address: 'Minasa Upa Blok AB4 No. 12', role: 'pelanggan' },
            { id: 'c3', name: 'Argus Cabang Sudirman', phone: '0813-9988-7766', kecamatan: 'Ujung Pandang', kelurahan: 'Mangkura', address: 'Jl. Jend. Sudirman No. 45', role: 'agen' },
            { id: 'c4', name: 'Restoran Nelayan', phone: '0811-4455-6677', kecamatan: 'Tamalate', kelurahan: 'Maccini Sombala', address: 'Jl. Metro Tanjung Bunga Ruko No. 8', role: 'pelanggan' },
            { id: 'c5', name: 'Pak RW 05', phone: '0853-4400-9988', kecamatan: 'Panakkukang', kelurahan: 'Masale', address: 'Perumahan Masale Permai Blok D7', role: 'pelanggan' },
            { id: 'c6', name: 'Toko Kelontong Indah', phone: '0821-8877-6655', kecamatan: 'Biringkanaya', kelurahan: 'Pai', address: 'Jl. Goa Ria No. 24', role: 'pelanggan' },
            { id: 'c7', name: 'Kopkar Makmur', phone: '0812-7766-5544', kecamatan: 'Rappocini', kelurahan: 'Banta-Bantaeng', address: 'Kawasan KBN Kav. 14', role: 'pelanggan' },
            { id: 'c8', name: 'Kantor Lurah', phone: '0811-1234-5678', kecamatan: 'Panakkukang', kelurahan: 'Pampang', address: 'Jl. Pampang Raya No. 1A', role: 'pelanggan' }
        ];

        const INITIAL_PRODUCTS = [
            { id: 'p1', name: 'Galon Refill (Air Argus) 19L', type: 'galon', costPrice: 10000, sellPrice: 13000, stock: 85, minStock: 25, unitName: 'Galon' },
            { id: 'p2', name: 'Galon Kosong Argus 19L', type: 'galon', costPrice: 25000, sellPrice: 35000, stock: 32, minStock: 12, unitName: 'Galon' },
            { id: 'p3', name: 'Galon Baru (Air Argus) 19L', type: 'galon', costPrice: 35000, sellPrice: 50000, stock: 20, minStock: 5, unitName: 'Galon' }
        ];

        const INITIAL_TRANSACTIONS = [
            { id: 'tx-13', timestamp: createTimestamp(0, 8, 0), type: 'sale', amount: 144000, cost: 104500, category: 'Penjualan', notes: 'Kirim Langganan Kantor Lurah', paymentMethod: 'cash', customerName: 'Kantor Lurah', items: [{ productId: 'p1', name: 'Galon Refill (Air Argus) 19L', quantity: 8, sellPrice: 18000, costPrice: 13000 }] },
            { id: 'tx-14', timestamp: createTimestamp(0, 8, 30), type: 'sale', amount: 165000, cost: 126000, category: 'Penjualan', notes: 'Beli paket wisuda ruko baru', paymentMethod: 'cash', customerName: 'Restoran Nelayan', items: [{ productId: 'p3', name: 'Galon Baru (Air Argus) 19L', quantity: 3, sellPrice: 55000, costPrice: 42000 }] }
        ];

        function App() {
            // States with localStorage persistence
            const [products, setProducts] = useState(() => JSON.parse(localStorage.getItem('ARGUS_PRODUCTS')) || INITIAL_PRODUCTS);
            const [transactions, setTransactions] = useState(() => JSON.parse(localStorage.getItem('ARGUS_TRANSACTIONS')) || INITIAL_TRANSACTIONS);
            const [customers, setCustomers] = useState(() => JSON.parse(localStorage.getItem('ARGUS_CUSTOMERS')) || INITIAL_CUSTOMERS);
            const [activeTab, setActiveTab] = useState('dashboard');

            // Targets
            const [targetRumah, setTargetRumah] = useState(() => parseInt(localStorage.getItem('TARGET_RUMAH')) || 100);
            const [targetGalon, setTargetGalon] = useState(() => parseInt(localStorage.getItem('TARGET_GALON')) || 100);
            const [showTargetModal, setShowTargetModal] = useState(false);

            // Sale/Transaction State
            const [selectedCustId, setSelectedCustId] = useState('');
            const [txType, setTxType] = useState('sale');
            const [quantities, setQuantities] = useState({});
            const [paymentMethod, setPaymentMethod] = useState('cash');
            const [txNotes, setTxNotes] = useState('');

            // Modals
            const [selectedReceipt, setSelectedReceipt] = useState(null);
            const [alert, setAlert] = useState(null);

            // Sync with local storage
            useEffect(() => {
                localStorage.setItem('ARGUS_PRODUCTS', JSON.stringify(products));
            }, [products]);

            useEffect(() => {
                localStorage.setItem('ARGUS_TRANSACTIONS', JSON.stringify(transactions));
            }, [transactions]);

            useEffect(() => {
                localStorage.setItem('ARGUS_CUSTOMERS', JSON.stringify(customers));
            }, [customers]);

            // Auto-dismiss alert after 3 seconds
            useEffect(() => {
                if (alert) {
                    const timer = setTimeout(() => setAlert(null), 3000);
                    return () => clearTimeout(timer);
                }
            }, [alert]);

            // Auto-render Lucide icons on any UI update
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            // Financial Calculations
            const summary = useMemo(() => {
                let totalRevenue = 0;
                let totalExpense = 0;
                let totalCost = 0;

                transactions.forEach(tx => {
                    if (tx.type === 'sale') {
                        totalRevenue += tx.amount;
                        totalCost += (tx.cost || 0);
                    } else if (tx.type === 'expense') {
                        totalExpense += tx.amount;
                    }
                });

                const grossProfit = totalRevenue - totalCost;
                const netProfit = grossProfit - totalExpense;

                return {
                    totalRevenue,
                    totalExpense,
                    netProfit
                };
            }, [transactions]);

            const formatCurrency = (val) => {
                return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(val);
            };

            const formatDate = (timestamp) => {
                const date = new Date(timestamp);
                return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
            };

            const cleanCustomerName = (name) => {
                return name ? name.replace(/(Pak\s+|Ibu\s+|Toko\s+)/gi, '') : '';
            };

            const handleCreateTransaction = (e) => {
                e.preventDefault();
                
                if (txType === 'sale') {
                    const customer = customers.find(c => c.id === selectedCustId);
                    if (!customer) {
                        setAlert({ type: 'error', message: 'Silakan pilih pelanggan terlebih dahulu!' });
                        return;
                    }

                    const items = [];
                    let totalAmount = 0;
                    let totalCost = 0;

                    products.forEach(p => {
                        const qty = parseInt(quantities[p.id]) || 0;
                        if (qty > 0) {
                            items.push({
                                productId: p.id,
                                name: p.name,
                                quantity: qty,
                                sellPrice: p.sellPrice,
                                costPrice: p.costPrice
                            });
                            totalAmount += qty * p.sellPrice;
                            totalCost += qty * p.costPrice;
                        }
                    });

                    if (items.length === 0) {
                        setAlert({ type: 'error', message: 'Silakan tentukan kuantitas produk!' });
                        return;
                    }

                    // Update stocks
                    const updatedProducts = products.map(p => {
                        const qty = parseInt(quantities[p.id]) || 0;
                        return { ...p, stock: Math.max(0, p.stock - qty) };
                    });
                    setProducts(updatedProducts);

                    const newTx = {
                        id: `tx-${Date.now()}`,
                        timestamp: Date.now(),
                        type: 'sale',
                        amount: totalAmount,
                        cost: totalCost,
                        category: 'Penjualan',
                        notes: txNotes || `Penjualan harian`,
                        paymentMethod,
                        customerName: customer.name,
                        items
                    };

                    setTransactions([newTx, ...transactions]);
                    setQuantities({});
                    setTxNotes('');
                    setSelectedCustId('');
                    setAlert({ type: 'success', message: 'Penjualan berhasil dicatat!' });
                } else {
                    // Record Expense
                    const amt = parseInt(quantities['expense-amount']) || 0;
                    const cat = quantities['expense-category'] || 'Operasional';
                    if (amt <= 0) {
                        setAlert({ type: 'error', message: 'Masukkan jumlah pengeluaran yang valid!' });
                        return;
                    }

                    const newTx = {
                        id: `tx-${Date.now()}`,
                        timestamp: Date.now(),
                        type: 'expense',
                        amount: amt,
                        category: cat,
                        notes: txNotes || 'Biaya operasional'
                    };

                    setTransactions([newTx, ...transactions]);
                    setQuantities({});
                    setTxNotes('');
                    setAlert({ type: 'success', message: 'Pengeluaran berhasil dicatat!' });
                }
            };

            return (
                <div class="flex-1 flex flex-col justify-between w-full h-full">
                    {/* Header */}
                    <div className="bg-[#1e1e24] text-white p-5 rounded-t-3xl shadow-md">
                        <div className="flex justify-between items-center mb-1">
                            <div>
                                <span className="text-[10px] uppercase font-bold tracking-widest text-[#d5a153]">Sistem Distribusi</span>
                                <h1 className="font-display font-black text-xl tracking-tight">ARGUS WATER</h1>
                            </div>
                            <div className="bg-[#d5a153] text-[#1e1e24] px-2.5 py-1 rounded-md text-xs font-black">
                                PRO VERSION
                            </div>
                        </div>
                    </div>

                    {/* Alerts Banner */}
                    {alert && (
                        <div className={`p-3 text-xs font-semibold flex items-center gap-2 ${alert.type === 'success' ? 'bg-emerald-500 text-white' : 'bg-rose-500 text-white'}`}>
                            <i data-lucide={alert.type === 'success' ? 'check-circle' : 'alert-circle'} class="w-4 h-4"></i>
                            <span>{alert.message}</span>
                        </div>
                    )}

                    {/* Content Section */}
                    <div className="flex-1 p-4 overflow-y-auto no-scrollbar max-h-[640px]">
                        
                        {/* Tab Dashboard / Laporan */}
                        {activeTab === 'dashboard' && (
                            <div className="space-y-4">
                                {/* Profit Margin Indicator (Solid Blue, same color as primary header) */}
                                <div className="bg-[#1e1e24] text-white rounded-2xl p-4 shadow-sm relative overflow-hidden min-h-[100px] flex flex-col justify-between">
                                    <div className="absolute right-3 top-3 opacity-15">
                                        <i data-lucide="trending-up" class="w-16 h-16 text-white"></i>
                                    </div>
                                    <div>
                                        <span className="text-[#d5a153] font-black text-[10px] uppercase tracking-wider">Untung Bersih (Net Profit)</span>
                                        <h4 className="font-display font-black text-2xl mt-0.5">{formatCurrency(summary.netProfit)}</h4>
                                    </div>
                                    <div className="flex justify-between items-center mt-2 pt-2 border-t border-white/10 text-[10px] text-white/80">
                                        <span>Total Omset: {formatCurrency(summary.totalRevenue)}</span>
                                        <span>Pengeluaran: {formatCurrency(summary.totalExpense)}</span>
                                    </div>
                                </div>

                                {/* Section Header: Laporan Persediaan & Pelanggan with Font Lichess (Montserrat) */}
                                <div>
                                    <h3 className="font-display font-extrabold text-neutral-800 text-sm tracking-tight flex items-center gap-1.5">
                                        <i data-lucide="package" class="w-4 h-4 text-neutral-600"></i>
                                        Laporan Persediaan & Pelanggan
                                    </h3>
                                    <p className="text-[10px] text-neutral-400">Stok riil di gudang distribusi Argus</p>
                                </div>

                                {/* 4 Boxes: Galon Refill, Galon Kosong, Total Pelanggan Rumah, Total Pelanggan Galon */}
                                <div className="grid grid-cols-2 gap-2.5">
                                    {/* Box 1 */}
                                    <div className="bg-white rounded-xl p-3 border border-neutral-200/80 shadow-xs flex flex-col justify-between min-h-[120px]">
                                        <div>
                                            <div className="flex justify-between items-start mb-1">
                                                <h4 className="font-bold text-neutral-800 text-[11.5px] truncate max-w-[70%]">Galon Refill</h4>
                                                <i data-lucide="droplet" class="w-3.5 h-3.5 text-blue-500"></i>
                                            </div>
                                            <p className="text-[9px] text-neutral-400 uppercase font-semibold">19L (Air Argus)</p>
                                        </div>
                                        <div>
                                            <div className="text-xl font-black font-display text-neutral-850">{products[0]?.stock || 0}</div>
                                            <div className="mt-1.5">
                                                <div className="flex justify-between text-[8px] text-neutral-400 mb-0.5">
                                                    <span>Gudang 150</span>
                                                    <span>{Math.round(((products[0]?.stock || 0) / 150) * 100)}%</span>
                                                </div>
                                                <div className="w-full bg-neutral-100 rounded-full h-3.5 overflow-hidden border border-neutral-200 relative">
                                                    <div className="h-full rounded-full bg-gradient-to-r from-blue-500 to-blue-600 transition-all" style={{ width: `${Math.min(100, Math.round(((products[0]?.stock || 0) / 150) * 100))}%` }}></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Box 2 */}
                                    <div className="bg-white rounded-xl p-3 border border-neutral-200/80 shadow-xs flex flex-col justify-between min-h-[120px]">
                                        <div>
                                            <div className="flex justify-between items-start mb-1">
                                                <h4 className="font-bold text-neutral-800 text-[11.5px] truncate max-w-[70%]">Galon Kosong</h4>
                                                <i data-lucide="archive" class="w-3.5 h-3.5 text-teal-500"></i>
                                            </div>
                                            <p className="text-[9px] text-neutral-400 uppercase font-semibold">19L (Argus)</p>
                                        </div>
                                        <div>
                                            <div className="text-xl font-black font-display text-neutral-850">{products[1]?.stock || 0}</div>
                                            <div className="mt-1.5">
                                                <div className="flex justify-between text-[8px] text-neutral-400 mb-0.5">
                                                    <span>Gudang 150</span>
                                                    <span>{Math.round(((products[1]?.stock || 0) / 150) * 100)}%</span>
                                                </div>
                                                <div className="w-full bg-neutral-100 rounded-full h-3.5 overflow-hidden border border-neutral-200 relative">
                                                    <div className="h-full rounded-full bg-gradient-to-r from-teal-400 to-teal-550 transition-all" style={{ width: `${Math.min(100, Math.round(((products[1]?.stock || 0) / 150) * 100))}%` }}></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Box 3 */}
                                    <div className="bg-white rounded-xl p-3 border border-neutral-200/80 shadow-xs flex flex-col justify-between min-h-[120px]">
                                        <div>
                                            <div className="flex justify-between items-start mb-1">
                                                <h4 className="font-bold text-neutral-800 text-[11.5px] truncate max-w-[70%]">Total Pelanggan</h4>
                                                <i data-lucide="home" class="w-3.5 h-3.5 text-indigo-500"></i>
                                            </div>
                                            <p className="text-[9px] text-indigo-500 uppercase font-semibold">Rumah</p>
                                        </div>
                                        <div>
                                            <div className="text-xl font-black font-display text-neutral-850">{50 + Math.max(0, customers.length - 8)}</div>
                                            <div className="mt-1.5">
                                                <div className="flex justify-between text-[8px] text-neutral-400 mb-0.5">
                                                    <span>Target {targetRumah}</span>
                                                    <span>{Math.round(((50 + Math.max(0, customers.length - 8)) / targetRumah) * 100)}%</span>
                                                </div>
                                                <div className="w-full bg-neutral-100 rounded-full h-3.5 overflow-hidden border border-neutral-200 relative">
                                                    <div className="h-full rounded-full bg-gradient-to-r from-indigo-500 to-indigo-600 transition-all" style={{ width: `${Math.min(100, Math.round(((50 + Math.max(0, customers.length - 8)) / targetRumah) * 100))}%` }}></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Box 4 */}
                                    <div className="bg-white rounded-xl p-3 border border-neutral-200/80 shadow-xs flex flex-col justify-between min-h-[120px]">
                                        <div>
                                            <div className="flex justify-between items-start mb-1">
                                                <h4 className="font-bold text-neutral-800 text-[11.5px] truncate max-w-[70%]">Total Pelanggan</h4>
                                                <i data-lucide="users" class="w-3.5 h-3.5 text-purple-500"></i>
                                            </div>
                                            <p className="text-[9px] text-purple-500 uppercase font-semibold font-sans">Galon</p>
                                        </div>
                                        <div>
                                            <div className="text-xl font-black font-display text-neutral-850">{70 + Math.max(0, customers.length - 8)}</div>
                                            <div className="mt-1.5">
                                                <div className="flex justify-between text-[8px] text-neutral-400 mb-0.5">
                                                    <span>Target {targetGalon}</span>
                                                    <span>{Math.round(((70 + Math.max(0, customers.length - 8)) / targetGalon) * 100)}%</span>
                                                </div>
                                                <div className="w-full bg-neutral-100 rounded-full h-3.5 overflow-hidden border border-neutral-200 relative">
                                                    <div className="h-full rounded-full bg-gradient-to-r from-purple-500 to-purple-600 transition-all" style={{ width: `${Math.min(100, Math.round(((70 + Math.max(0, customers.length - 8)) / targetGalon) * 100))}%` }}></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Set Target Capaian Center Position */}
                                <div className="flex justify-center py-2">
                                    <button 
                                        onClick={() => setShowTargetModal(true)}
                                        className="text-xs bg-[#1e1e24] text-white px-4 py-2 rounded-xl font-extrabold flex items-center gap-1.5 hover:bg-neutral-800 transition"
                                    >
                                        <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5 text-[#d5a153]"></i>
                                        Atur Target Capaian
                                    </button>
                                </div>

                                {/* Ringkasan Pelanggan / Agen Baru */}
                                <div className="bg-white rounded-2xl p-4 border border-neutral-200/60 shadow-xs">
                                    <div className="flex items-center justify-between mb-3 border-b border-neutral-100 pb-2">
                                        <div className="flex items-center gap-1.5">
                                            <i data-lucide="users" class="w-4 h-4 text-blue-600"></i>
                                            <h3 className="font-display font-bold text-neutral-800 text-xs shrink-0">Ringkasan Pelanggan / Agen Baru</h3>
                                        </div>
                                        <span className="text-[9px] text-neutral-400">Total: {customers.length}</span>
                                    </div>

                                    <div className="divide-y divide-neutral-100">
                                        {customers.slice(-4).reverse().map(cust => (
                                            <div key={cust.id} className="py-2.5 flex items-center justify-between">
                                                <div className="flex flex-col min-w-0 pr-2">
                                                    <span className="font-extrabold text-neutral-800 text-[13px] truncate block">
                                                        {cleanCustomerName(cust.name)}
                                                    </span>
                                                    <div className="flex items-center gap-1.5 flex-wrap mt-0.5">
                                                        {cust.role === 'agen' ? (
                                                            <span className="text-[7px] font-extrabold text-yellow-700 bg-yellow-50 px-1 py-0.5 rounded border border-yellow-200 uppercase tracking-wide leading-none shrink-0">
                                                                Agen
                                                            </span>
                                                        ) : (
                                                            <span className="text-[7px] font-extrabold text-emerald-700 bg-emerald-50 px-1 py-0.5 rounded border border-emerald-200 uppercase tracking-wide leading-none shrink-0 border-solid">
                                                                Pelanggan
                                                            </span>
                                                        )}
                                                        <span className="text-[9px] text-neutral-400 truncate max-w-[200px]" title={cust.address}>
                                                            {cust.address || 'Tanpa Alamat'}
                                                        </span>
                                                    </div>
                                                </div>
                                                <span className="text-[9px] bg-neutral-100 text-neutral-600 px-1.5 py-0.5 rounded font-bold uppercase shrink-0">
                                                    {cust.kecamatan || 'Umum'}
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Tab Kasir (Sales & Expense) */}
                        {activeTab === 'kasir' && (
                            <form onSubmit={handleCreateTransaction} className="space-y-4">
                                <div className="bg-white rounded-2xl p-4 border border-neutral-200/50 shadow-xs space-y-3">
                                    <h3 className="text-xs font-display font-black text-neutral-800 uppercase tracking-wider">Aktivitas Baru</h3>
                                    
                                    <div className="grid grid-cols-2 gap-2">
                                        <button type="button" onClick={() => setTxType('sale')} className={`py-2 rounded-xl text-xs font-bold transition-all ${txType === 'sale' ? 'bg-[#1e1e24] text-white' : 'bg-neutral-100 text-neutral-600'}`}>
                                            Penjualan Saja
                                        </button>
                                        <button type="button" onClick={() => setTxType('expense')} className={`py-2 rounded-xl text-xs font-bold transition-all ${txType === 'expense' ? 'bg-[#1e1e24] text-white' : 'bg-neutral-100 text-neutral-600'}`}>
                                            Biaya / Pengeluaran
                                        </button>
                                    </div>

                                    {txType === 'sale' ? (
                                        <div className="space-y-3">
                                            <div>
                                                <label className="text-[10px] font-bold text-neutral-500 uppercase block mb-1">Pilih Pelanggan / Agen</label>
                                                <select 
                                                    value={selectedCustId} 
                                                    onChange={e => setSelectedCustId(e.target.value)}
                                                    className="w-full bg-neutral-50 border border-neutral-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                                >
                                                    <option value="">-- Pilih Pembeli --</option>
                                                    {customers.map(c => (
                                                        <option key={c.id} value={c.id}>{c.name} ({c.role === 'agen' ? 'Agen' : 'Pelanggan'})</option>
                                                    ))}
                                                </select>
                                            </div>

                                            <div className="space-y-3 pt-2">
                                                <label className="text-[10px] font-bold text-neutral-500 uppercase block">Kuantitas Pembelian</label>
                                                {products.map(p => (
                                                    <div key={p.id} className="flex justify-between items-center text-xs bg-neutral-50 p-2.5 rounded-xl border border-neutral-150">
                                                        <div>
                                                            <div className="font-bold text-neutral-800">{p.name}</div>
                                                            <div className="text-[10px] text-neutral-450">Stok: {p.stock} | Harga: {formatCurrency(p.sellPrice)}</div>
                                                        </div>
                                                        <div className="flex items-center gap-1">
                                                            <input 
                                                                type="number" 
                                                                min="0" 
                                                                placeholder="0"
                                                                value={quantities[p.id] || ''} 
                                                                onChange={e => setQuantities({...quantities, [p.id]: e.target.value})}
                                                                className="w-16 text-center border border-neutral-300 rounded-lg px-1 py-1 text-xs font-bold focus:ring-1 focus:ring-blue-500"
                                                            />
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>

                                            <div className="grid grid-cols-2 gap-2 pt-2">
                                                <div>
                                                    <label className="text-[10px] font-bold text-neutral-500 uppercase block mb-1">Cara Bayar</label>
                                                    <select 
                                                        value={paymentMethod} 
                                                        onChange={e => setPaymentMethod(e.target.value)}
                                                        className="w-full bg-neutral-50 border border-neutral-200 rounded-xl px-2.5 py-2 text-xs"
                                                    >
                                                        <option value="cash">Tunai / Cash</option>
                                                        <option value="transfer">Transfer Bank</option>
                                                        <option value="credit">Hutang (BON)</option>
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="text-[10px] font-bold text-neutral-500 uppercase block mb-1">Catatan Tambahan</label>
                                                    <input 
                                                        type="text" 
                                                        placeholder="Contoh: Kirim jam 2" 
                                                        value={txNotes} 
                                                        onChange={e => setTxNotes(e.target.value)}
                                                        className="w-full bg-neutral-50 border border-neutral-200 rounded-xl px-2.5 py-2 text-xs"
                                                    />
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="space-y-3">
                                            <div>
                                                <label className="text-[10px] font-bold text-neutral-500 uppercase block mb-1">Kategori Biaya</label>
                                                <select 
                                                    value={quantities['expense-category'] || 'Operasional'} 
                                                    onChange={e => setQuantities({...quantities, 'expense-category': e.target.value})}
                                                    className="w-full bg-neutral-50 border border-neutral-200 rounded-xl px-3 py-2 text-xs"
                                                >
                                                    <option value="Bensin & Operasional">Bensin & Operasional</option>
                                                    <option value="Konsumsi">Konsumsi</option>
                                                    <option value="Peralatan & Refill">Peralatan & Refill</option>
                                                    <option value="Gaji Karyawan">Gaji Karyawan</option>
                                                    <option value="Sewa Tempat">Sewa Tempat</option>
                                                    <option value="Lain-lain">Lain-lain</option>
                                                </select>
                                            </div>

                                            <div>
                                                <label className="text-[10px] font-bold text-neutral-500 uppercase block mb-1">Jumlah Biaya (Rp)</label>
                                                <input 
                                                    type="number" 
                                                    placeholder="Contoh: 50000" 
                                                    value={quantities['expense-amount'] || ''} 
                                                    onChange={e => setQuantities({...quantities, 'expense-amount': e.target.value})}
                                                    className="w-full bg-neutral-50 border border-neutral-200 rounded-xl px-3 py-2 text-xs focus:ring-1 focus:ring-blue-500"
                                                />
                                            </div>

                                            <div>
                                                <label className="text-[10px] font-bold text-neutral-500 uppercase block mb-1">Keterangan Biaya</label>
                                                <input 
                                                    type="text" 
                                                    placeholder="Contoh: Solar truk pickup" 
                                                    value={txNotes} 
                                                    onChange={e => setTxNotes(e.target.value)}
                                                    className="w-full bg-neutral-50 border border-neutral-200 rounded-xl px-3 py-2 text-xs"
                                                />
                                            </div>
                                        </div>
                                    )}

                                    <button 
                                        type="submit" 
                                        className="w-full py-3 rounded-xl bg-gradient-to-r from-blue-650 to-blue-700 text-white font-black text-xs uppercase shadow-sm hover:opacity-90 transition mt-4 bg-[#1e1e24]"
                                    >
                                        Simpan Transaksi Ke Database
                                    </button>
                                </div>
                            </form>
                        )}

                        {/* Tab Riwayat */}
                        {activeTab === 'riwayat' && (
                            <div className="space-y-3">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-xs font-display font-black text-neutral-800 uppercase tracking-wider">Aktivitas Transaksi</h3>
                                    <span className="text-[10px] text-neutral-400">Total: {transactions.length} baris</span>
                                </div>

                                <div className="space-y-2">
                                    {transactions.map(tx => (
                                        <div 
                                            key={tx.id} 
                                            onClick={() => setSelectedReceipt(tx)} 
                                            className="bg-white p-3 rounded-xl border border-neutral-200/80 hover:border-blue-400 transition cursor-pointer flex justify-between items-center shadow-xs"
                                        >
                                            <div className="min-w-0 flex-1 pr-2">
                                                <div className="flex items-center gap-1.5 flex-wrap">
                                                    <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded border uppercase ${tx.type === 'sale' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-amber-50 text-amber-700 border-amber-200'}`}>
                                                        {tx.type === 'sale' ? 'Jual' : 'Biaya'}
                                                    </span>
                                                    <span className="font-extrabold text-neutral-800 text-[11px] truncate">
                                                        {tx.type === 'sale' ? (tx.customerName || 'Pelanggan Umum') : tx.category}
                                                    </span>
                                                </div>
                                                <p className="text-[9px] text-neutral-400 mt-1 truncate">{tx.notes}</p>
                                                <span className="text-[8px] text-neutral-400 font-mono block mt-0.5">{formatDate(tx.timestamp)}</span>
                                            </div>
                                            <div className="text-right shrink-0">
                                                <div className={`font-mono text-xs font-black ${tx.type === 'sale' ? 'text-emerald-600' : 'text-rose-600'}`}>
                                                    {tx.type === 'sale' ? '+' : '-'}{formatCurrency(tx.amount)}
                                                </div>
                                                <span className="text-[8px] bg-neutral-100 px-1 py-0.5 rounded text-neutral-500 font-bold uppercase">{tx.paymentMethod || 'cash'}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Tab Pelanggan */}
                        {activeTab === 'pelanggan' && (
                            <div className="space-y-3">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-xs font-display font-black text-neutral-800 uppercase tracking-wider">Daftar Wilayah Pelanggan</h3>
                                    <span className="text-[10px] text-[#d5a153] font-bold">Kec: Biringkanaya & Panakkukang</span>
                                </div>

                                <div className="space-y-3">
                                    {customers.map(c => (
                                        <div key={c.id} className="bg-white p-3 rounded-xl border border-neutral-200 shadow-xs">
                                            <div className="flex justify-between items-start mb-1.5">
                                                <div>
                                                    <h4 className="font-extrabold text-neutral-800 text-sm">{c.name}</h4>
                                                    <p className="text-[10px] text-neutral-400">{c.phone || 'Tanpa Kontak'}</p>
                                                </div>
                                                <span className={`text-[8px] uppercase font-black px-1.5 py-0.5 rounded ${c.role === 'agen' ? 'bg-amber-100 text-amber-800 border border-amber-200' : 'bg-emerald-100 text-emerald-800 border border-emerald-200'}`}>
                                                    {c.role || 'pelanggan'}
                                                </span>
                                            </div>
                                            
                                            <div className="bg-neutral-50 px-2 py-1.5 rounded-lg text-[10px] text-neutral-600 border border-neutral-150 space-y-0.5">
                                                <div><strong className="text-neutral-500">Alamat:</strong> {c.address || 'Tanpa detail alamat'}</div>
                                                <div className="flex gap-4">
                                                    <div><strong className="text-neutral-500">Kec:</strong> {c.kecamatan || 'Umum'}</div>
                                                    <div><strong className="text-neutral-500">Kel:</strong> {c.kelurahan || 'Umum'}</div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Tab Standard CSS / Produk */}
                        {activeTab === 'produk' && (
                            <div className="space-y-3">
                                <h3 className="text-xs font-display font-black text-neutral-800 uppercase tracking-wider">Kelola Produk</h3>
                                <div className="space-y-2">
                                    {products.map(p => (
                                        <div key={p.id} className="bg-white p-3 rounded-xl border border-neutral-200 shadow-xs">
                                            <div className="flex justify-between items-start mb-2">
                                                <div>
                                                    <h4 className="font-extrabold text-xs text-neutral-800">{p.name}</h4>
                                                    <p className="text-[9px] text-[#d5a153] font-bold uppercase">{p.type} | {p.unitName}</p>
                                                </div>
                                                <span className={`text-[9px] px-2 py-0.5 rounded font-black ${p.stock <= p.minStock ? 'bg-rose-100 text-rose-800' : 'bg-blue-100 text-blue-800'}`}>
                                                    Stok: {p.stock}
                                                </span>
                                            </div>

                                            <div className="grid grid-cols-2 gap-2 text-[10px] bg-neutral-50 p-2 rounded-lg border border-neutral-150 font-mono text-neutral-700">
                                                <div>Modal: {formatCurrency(p.costPrice)}</div>
                                                <div>Jual: {formatCurrency(p.sellPrice)}</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                    </div>

                    {/* Target Capaian Modal Settings */}
                    {showTargetModal && (
                        <div className="absolute inset-0 bg-[#1e1e24]/75 z-40 flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-xs rounded-2xl p-4 shadow-xl border border-neutral-200 relative">
                                <button onClick={() => setShowTargetModal(false)} className="absolute right-3 top-3 text-neutral-400 hover:text-neutral-700">
                                    <i data-lucide="x" class="w-4 h-4"></i>
                                </button>
                                <h3 className="font-display font-extrabold text-[#1e1e24] text-sm mb-3">Atur Target Pelanggan</h3>
                                
                                <div className="space-y-3 mb-4">
                                    <div>
                                        <label className="text-[10px] font-bold text-neutral-500 uppercase block mb-1">Target Rumah</label>
                                        <input 
                                            type="number" 
                                            value={targetRumah} 
                                            onChange={e => {
                                                const v = parseInt(e.target.value) || 0;
                                                setTargetRumah(v);
                                                localStorage.setItem('TARGET_RUMAH', v);
                                            }}
                                            className="w-full bg-neutral-50 border border-neutral-200 rounded-xl px-3 py-1.5 text-xs text-[#1e1e24] font-bold"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-neutral-500 uppercase block mb-1">Target Depot / Agen Galon</label>
                                        <input 
                                            type="number" 
                                            value={targetGalon} 
                                            onChange={e => {
                                                const v = parseInt(e.target.value) || 0;
                                                setTargetGalon(v);
                                                localStorage.setItem('TARGET_GALON', v);
                                            }}
                                            className="w-full bg-neutral-50 border border-neutral-200 rounded-xl px-3 py-1.5 text-xs text-[#1e1e24] font-bold"
                                        />
                                    </div>
                                </div>

                                <button 
                                    onClick={() => setShowTargetModal(false)}
                                    className="w-full py-2 bg-[#1e1e24] text-white rounded-xl text-xs font-black uppercase hover:bg-neutral-800 transition"
                                >
                                    Simpan Perubahan
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Receipt Modal */}
                    {selectedReceipt && (
                        <div className="absolute inset-0 bg-[#1e1e24]/75 z-40 flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-xs rounded-2xl p-4 shadow-xl border border-neutral-200 relative font-mono text-[11px] leading-relaxed text-neutral-700">
                                <button onClick={() => setSelectedReceipt(null)} className="absolute right-3 top-3 text-neutral-400 hover:text-neutral-700 font-sans">
                                    <i data-lucide="x" class="w-4 h-4"></i>
                                </button>
                                
                                <div className="text-center pb-2 border-b border-dashed border-neutral-205">
                                    <h4 className="font-display font-black text-xs text-[#1e1e24] tracking-tight">DEPOT ARGUS WATER</h4>
                                    <p className="text-[8px] font-sans">Kirim Harian Air Isi Ulang / Baru</p>
                                    <p className="text-[8px] font-mono mt-1">{formatDate(selectedReceipt.timestamp)}</p>
                                </div>

                                <div className="py-2.5 space-y-1">
                                    <div><strong>No. ID:</strong> {selectedReceipt.id}</div>
                                    <div><strong>Untuk:</strong> {selectedReceipt.customerName || 'Umum'}</div>
                                    <div><strong>Status:</strong> {selectedReceipt.paymentMethod?.toUpperCase() || 'LUNAS'}</div>
                                </div>

                                <div className="py-2 border-t border-b border-dashed border-neutral-200">
                                    {selectedReceipt.items ? selectedReceipt.items.map((item, idx) => (
                                        <div key={idx} className="flex justify-between">
                                            <span>{item.quantity}x {item.name.slice(0,18)}...</span>
                                            <span>{formatCurrency(item.quantity * item.sellPrice)}</span>
                                        </div>
                                    )) : (
                                        <div className="flex justify-between">
                                            <span>{selectedReceipt.category}</span>
                                            <span>{formatCurrency(selectedReceipt.amount)}</span>
                                        </div>
                                    )}
                                </div>

                                <div className="pt-2 flex justify-between font-bold text-[#1e1e24] text-xs">
                                    <span>TOTAL:</span>
                                    <span>{formatCurrency(selectedReceipt.amount)}</span>
                                </div>

                                <div className="mt-4 pt-1 text-center text-[7.5px] font-sans text-neutral-400">
                                    Terima kasih atas langganan Anda. Air Argus selalu murni dan menyehatkan!
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Bottom Navigation Tabs */}
                    <div className="bg-[#1e1e24] text-white/70 p-1 flex justify-around items-center border-t border-white/5 rounded-b-3xl">
                        <button 
                            onClick={() => setActiveTab('dashboard')} 
                            className={`flex flex-col items-center py-2 px-3 text-[9px] font-bold transition-all ${activeTab === 'dashboard' ? 'text-white font-black' : 'hover:text-white'}`}
                        >
                            <i data-lucide="trending-up" class={`w-4 h-4 mb-0.5 ${activeTab === 'dashboard' ? 'scale-110 text-[#d5a153]' : ''}`}></i>
                            Laporan
                        </button>
                        <button 
                            onClick={() => setActiveTab('kasir')} 
                            className={`flex flex-col items-center py-2 px-3 text-[9px] font-bold transition-all ${activeTab === 'kasir' ? 'text-white font-black' : 'hover:text-white'}`}
                        >
                            <i data-lucide="plus-circle" class={`w-4 h-4 mb-0.5 ${activeTab === 'kasir' ? 'scale-110 text-[#d5a153]' : ''}`}></i>
                            Kasir
                        </button>
                        <button 
                            onClick={() => setActiveTab('produk')} 
                            className={`flex flex-col items-center py-2 px-3 text-[9px] font-bold transition-all ${activeTab === 'produk' ? 'text-white font-black' : 'hover:text-white'}`}
                        >
                            <i data-lucide="package" class={`w-4 h-4 mb-0.5 ${activeTab === 'produk' ? 'scale-110 text-[#d5a153]' : ''}`}></i>
                            Produk
                        </button>
                        <button 
                            onClick={() => setActiveTab('pelanggan')} 
                            className={`flex flex-col items-center py-2 px-3 text-[9px] font-bold transition-all ${activeTab === 'pelanggan' ? 'text-white font-black' : 'hover:text-white'}`}
                        >
                            <i data-lucide="users" class={`w-4 h-4 mb-0.5 ${activeTab === 'pelanggan' ? 'scale-110 text-[#d5a153]' : ''}`}></i>
                            Pelanggan
                        </button>
                        <button 
                            onClick={() => setActiveTab('riwayat')} 
                            className={`flex flex-col items-center py-2 px-3 text-[9px] font-bold transition-all ${activeTab === 'riwayat' ? 'text-white font-black' : 'hover:text-white'}`}
                        >
                            <i data-lucide="history" class={`w-4 h-4 mb-0.5 ${activeTab === 'riwayat' ? 'scale-110 text-[#d5a153]' : ''}`}></i>
                            Riwayat
                        </button>
                    </div>
                </div>
            );
        }

        // Render React components
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
