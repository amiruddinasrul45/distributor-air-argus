        }

        // Helper Utilities
        const formatCurrency = (val) => 'Rp ' + Math.abs(val).toLocaleString('id-ID');
        const formatDate = (t) => {
          const d = new Date(t);
          return `${d.getDate()} ${['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'][d.getMonth()]} ${d.getFullYear()}`;
        };

        const INITIAL_CUSTOMERS = [
          { id: 'c1', name: 'Pak Budi', phone: '0812-3456-7890', kecamatan: 'Biringkanaya', kelurahan: 'Daya', address: 'Jl. Perintis Kemerdekaan KM 12', role: 'rumah' },
          { id: 'c2', name: 'Toko Berkah Utama', phone: '0852-1122-3344', kecamatan: 'Rappocini', kelurahan: 'Kassi-Kassi', address: 'Minasa Upa Blok AB4', role: 'galon' }
        ];

        const INITIAL_PRODUCTS = [
          { id: 'p1', name: 'Galon Refill (Air Argus) 19L', type: 'galon', costPrice: 10000, sellPrice: 13000, stock: 85, minStock: 25 },
          { id: 'p2', name: 'Galon Kosong Argus 19L', type: 'galon', costPrice: 25000, sellPrice: 35000, stock: 32, minStock: 12 }
        ];

          { id: 'tx-1', timestamp: Date.now() - 3600000, type: 'sale', amount: 309000, cost: 210000, category: 'Penjualan', notes: 'Setoran Harian', customerName: 'Pak Budi' }
        ];

          const [products, setProducts] = useState(() => JSON.parse(localStorage.getItem('ARG_PRODUCTS')) || INITIAL_PRODUCTS);
          const [transactions, setTransactions] = useState(() => JSON.parse(localStorage.getItem('ARG_TX')) || INITIAL_TRANSACTIONS);
          const [customers, setCustomers] = useState(() => JSON.parse(localStorage.getItem('ARG_CUST')) || INITIAL_CUSTOMERS);
          const [activeTab, setActiveTab] = useState('dashboard');

          useEffect(() => { localStorage.setItem('ARG_PRODUCTS', JSON.stringify(products)); }, [products]);
          useEffect(() => { localStorage.setItem('ARG_TX', JSON.stringify(transactions)); }, [transactions]);
          useEffect(() => { localStorage.setItem('ARG_CUST', JSON.stringify(customers)); }, [customers]);

          const financialSummary = useMemo(() => {
            let totalRevenue = 0, totalCost = 0, totalExpense = 0;
            transactions.forEach(tx => {
              if (tx.type === 'sale') { totalRevenue += tx.amount; totalCost += tx.cost; }
              else { totalExpense += tx.amount; }
            });
            return { totalRevenue, totalExpense, netProfit: totalRevenue - totalCost - totalExpense };
          }, [transactions]);

          const totalPelangganRumah = customers.filter(c => c.role === 'rumah').length;
          const totalPelangganGalon = customers.filter(c => c.role === 'galon').length;

          return (

                  </div>
                </div>
                <div>
                  <span className="text-xs bg-amber-500/20 text-amber-300 font-bold px-3 py-1.5 rounded-xl border border-amber-500/30">
                    PRO VERSION
                  </span>
                </div>
              </header>

              {/* PRIMARY CONTENT */}

                {/* 1. FINANCIAL PANEL */}
                <div className="bg-navy text-white rounded-3xl p-6 shadow-xl space-y-4">
                  <div>
                    <span className="text-[10px] uppercase font-bold tracking-wider text-slate-400 block">UNTUNG BERSH (NET PROFIT)</span>
                    <h2 className="font-heading font-black text-4xl text-white mt-1">{formatCurrency(financialSummary.netProfit)}</h2>
                  </div>
                  <hr className="border-slate-800" />
                  <div className="flex justify-between text-xs text-slate-300">
                    <div>
                      <span className="block text-[10px] text-slate-400 font-medium">Total Omset</span>
                      <span className="font-semibold text-sm">{formatCurrency(financialSummary.totalRevenue)}</span>
                    </div>
                    <div className="text-right">
                      <span className="block text-[10px] text-slate-400 font-medium">Pengeluaran</span>
                      <span className="font-semibold text-sm">{formatCurrency(financialSummary.totalExpense)}</span>
                    </div>
                  </div>
                </div>

                {/* SECTION TITLE */}

                  <Icon name="Package" size={18} className="text-slate-600" />

                </div>
                <p className="text-xs text-slate-500 -mt-4 px-1">Stok riil di gudang distribusi Argus</p>

                {/* 2. GRID CARDS */}
                <div className="grid grid-cols-2 gap-4">
                  {/* Card 1 */}
                  <div className="bg-white rounded-2xl p-4 border border-slate-100 shadow-xs flex flex-col justify-between min-h-[110px]">
                    <div className="flex justify-between items-start">
                      <div>
                        <h4 className="text-sm font-semibold text-slate-800">Galon Refill</h4>
                        <span className="text-[9px] text-slate-500 block">19L (AIR ARGUS)</span>
                      </div>
                      <span className="text-blue-500">💧</span>
                    </div>
                    <div className="mt-4">
                      <span className="font-heading font-black text-3xl text-slate-800 block">{products?.stock || 0}</span>
                      <div className="flex justify-between text-[9px] text-slate-500 mt-1">
                        <span>Gudang 150</span>
                        <span>57%</span>
                      </div>
                      <div className="w-full bg-slate-100 h-1.5 rounded-full mt-1 overflow-hidden">
                        <div className="bg-blue-500 h-full rounded-full" style={{width: '57%'}}></div>
                      </div>
                    </div>
                  </div>

                  {/* Card 2 */}
                  <div className="bg-white rounded-2xl p-4 border border-slate-100 shadow-xs flex flex-col justify-between min-h-[110px]">
                    <div className="flex justify-between items-start">
                      <div>
                        <h4 className="text-sm font-semibold text-slate-800">Galon Kosong</h4>
                        <span className="text-[9px] text-slate-500 block">19L (ARGUS)</span>
                      </div>
                      <span className="text-teal-500">🪣</span>
                    </div>
                    <div className="mt-4">
                      <span className="font-heading font-black text-3xl text-slate-800 block">{products?.stock || 0}</span>

                        <span className="text-[9px] text-blue-600 font-bold block uppercase tracking-wider">Rumah</span>

                      </div>

                  </div>

                    <div className="flex justify-between items-start">
                      <div>
                        <h4 className="text-sm font-semibold text-slate-800">Total Pelanggan</h4>
                        <span className="text-[9px] text-indigo-600 font-bold block uppercase tracking-wider">Galon</span>
                      </div>
                      <span className="text-indigo-600">👥</span>
                    </div>
                    <div className="mt-4">
                      <span className="font-heading font-black text-3xl text-slate-800 block">70</span>
                      <div className="flex justify-between text-[9px] text-slate-500 mt-1">
                        <span>Target 100</span>
                        <span>70%</span>
                      </div>
                      <div className="w-full bg-slate-100 h-1.5 rounded-full mt-1 overflow-hidden">
                        <div className="bg-indigo-600 h-full rounded-full" style={{width: '70%'}}></div>

                  </div>
                </div>

              </main>

              {/* BOTTOM MENUBAR NAVIGATION */}

                </button>
                <button onClick={() => setActiveTab('history')} className={`flex flex-col items-center gap-1 text-xs font-medium ${activeTab === 'history' ? 'text-blue-600' : 'text-slate-400'}`}>
                  <Icon name="History" size={20} />
                  <span>Riwayat</span>

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
